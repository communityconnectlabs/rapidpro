name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
jobs:
  trigger:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dev/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins job
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          
          # Trigger build
          curl -fsS -X POST \
            "$JENKINS_URL/job/development/buildWithParameters?token=$JENKINS_API_TOKEN&GIT_SHA=$GIT_SHA&GIT_REF=$GIT_REF"
