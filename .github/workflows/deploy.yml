name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - "dev/**"
jobs:
  trigger:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dev/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins job
        env:
          JENKINS_DOMAIN: ${{ secrets.JENKINS_DOMAIN }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_PASSWORD: ${{ secrets.JENKINS_PASSWORD }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          GIT_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          
          # Trigger build
          curl --location --head "https://$JENKINS_USERNAME:$JENKINS_PASSWORD@$JENKINS_DOMAIN/job/development/job/rapidpro/build?token=$JENKINS_API_TOKEN"
