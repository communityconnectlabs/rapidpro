[supervisord]

[program:ccl-gunicorn]
command = poetry run gunicorn --timeout 90 --workers=%(ENV_NUM_GUNICORN_WORKERS)s --threads=%(ENV_NUM_GUNICORN_THREADS)s -t 300 --bind 0.0.0.0:8080 temba.wsgi:application
directory = /rapidpro
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ccl-nginx]
command = service nginx start
